<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RSVP for the wedding of Wesley and Dionne." />
    <title>RSVP | Wesley &amp; Dionne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://script.google.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Ma+Shan+Zheng&amp;family=Noto+Serif+SC:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="rsvp.css" />
    <script src="rsvp.js" defer></script>
  </head>
  <body>
    <button class="language-toggle" type="button" aria-label="Switch language">
      <span class="active" data-language="en">EN</span>
      <span aria-hidden="true">|</span>
      <span data-language="zh">中文</span>
    </button>

    <main class="rsvp-page">
      <img class="page-motif motif-left" src="assets/motif-blossom.png" alt="" />
      <img class="page-motif motif-right" src="assets/itinerary-peony.png" alt="" />
      <img class="page-motif motif-lower-left" src="assets/motif-upper-peony.png" alt="" />
      <img class="page-motif motif-petals" src="assets/motif-petals.png" alt="" />

      <a class="back-link" href="index.html" data-i18n="back">← Wedding website</a>

      <section class="rsvp-shell" id="lookup-view" aria-labelledby="rsvp-heading">
        <div class="double-happiness" aria-hidden="true">囍</div>
        <h1 id="rsvp-heading" data-i18n="heading">Kindly RSVP</h1>
        <img class="heading-knot" src="assets/motif-knot.png" alt="" />
        <p class="deadline" data-i18n="deadline">Please respond by 1 February 2027.</p>
        <p class="intro is-loading" id="lookup-intro" data-i18n="loadingInvitation">
          Loading your invitation…
        </p>
        <p class="personal-link-help hidden" id="link-help" data-i18n="linkHelp">
          If your link is not working, please contact the couple for assistance.
        </p>
        <p class="form-status" id="lookup-status" role="status"></p>
      </section>

      <section class="rsvp-shell hidden" id="response-view" aria-labelledby="response-heading">
        <div class="double-happiness" aria-hidden="true">囍</div>
        <p class="eyebrow" data-i18n="invitationFound">Invitation found</p>
        <h1 id="response-heading"><span data-i18n="welcome">Welcome,</span> <span id="party-name"></span></h1>
        <img class="heading-knot" src="assets/motif-knot.png" alt="" />
        <p class="seat-note" id="seat-note"></p>

        <form id="response-form">
          <fieldset class="attendance-fieldset">
            <legend data-i18n="attendanceQuestion">Will you be joining us?</legend>
            <div class="radio-row">
              <label>
                <input type="radio" name="attendance" value="yes" required />
                <span data-i18n="accepts">Yes</span>
              </label>
              <label>
                <input type="radio" name="attendance" value="no" />
                <span data-i18n="declines">No</span>
              </label>
            </div>
          </fieldset>

          <div class="hidden" id="attendance-details">
            <div class="form-grid">
              <div class="field">
                <label for="attendee-count" data-i18n="numberAttending">Number attending</label>
                <select id="attendee-count"></select>
              </div>

              <div class="field hidden" id="tea-field">
                <label for="tea-attendance" data-i18n="teaAttendance">Tea ceremony attendance</label>
                <select id="tea-attendance">
                  <option value="yes" data-i18n="willAttend">Will attend</option>
                  <option value="no" data-i18n="unableAttend">Unable to attend</option>
                </select>
              </div>

              <div class="field">
                <label for="guest-one" data-i18n="guestOne">Guest 1 full name</label>
                <input id="guest-one" required />
              </div>

              <div class="field hidden" id="guest-two-field">
                <label for="guest-two" data-i18n="guestTwo">Guest 2 full name</label>
                <input id="guest-two" />
              </div>

              <div class="field">
                <label for="dietary">
                  <span data-i18n="dietary">Dietary requirements</span>
                  <span class="optional" data-i18n="optional">(optional)</span>
                </label>
                <input id="dietary" />
              </div>

              <div class="field field-full">
                <label for="notes">
                  <span data-i18n="notes">Notes</span>
                  <span class="optional" data-i18n="optional">(optional)</span>
                </label>
                <textarea id="notes"></textarea>
              </div>
            </div>
          </div>

          <button class="ornate-button" type="submit" data-i18n="submit">Submit RSVP</button>
          <p class="form-status" id="submit-status" role="status"></p>
        </form>
      </section>

    </main>

    <footer aria-hidden="true">
      <img src="assets/motif-knot.png" alt="" />
      <span>囍</span>
    </footer>
  </body>
</html>
