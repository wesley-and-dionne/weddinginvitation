<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thank you for responding to Wesley and Dionne's wedding invitation." />
    <title>Thank You | Wesley &amp; Dionne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Ma+Shan+Zheng&amp;family=Noto+Serif+SC:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="rsvp.css" />
    <script src="thank-you.js" defer></script>
  </head>
  <body>
    <button class="language-toggle" type="button" aria-label="Switch language">
      <span class="active" data-language="en">EN</span>
      <span aria-hidden="true">|</span>
      <span data-language="zh">中文</span>
    </button>

    <main class="rsvp-page thank-you-page">
      <img class="page-motif motif-left" src="assets/motif-blossom.png" alt="" />
      <img class="page-motif motif-right" src="assets/itinerary-peony.png" alt="" />
      <img class="page-motif motif-lower-left" src="assets/motif-upper-peony.png" alt="" />
      <img class="page-motif motif-petals" src="assets/motif-petals.png" alt="" />

      <section class="thank-you-shell" aria-labelledby="thank-you-heading">
        <div class="double-happiness" aria-hidden="true">囍</div>
        <h1 id="thank-you-heading" data-i18n="heading">Thank You</h1>
        <img class="heading-knot" src="assets/motif-knot.png" alt="" />
        <p class="thank-you-message" id="thank-you-message"></p>
        <a class="ornate-button home-button" href="index.html" data-i18n="returnWebsite">
          Return to wedding website
        </a>
      </section>
    </main>

    <footer aria-hidden="true">
      <img src="assets/motif-knot.png" alt="" />
      <span>囍</span>
    </footer>
  </body>
</html>
